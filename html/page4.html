<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
     <title> Hóa đơn mua hàng </title>
</head>

<body>
    <table border ="1">
        <tr>
            <th>STT</th>
            <th>Tên sản phẩm</th>
            <th>Số lượng</th>
            <th>Đơn giá </th>
            <th>Thành tiền</th>

        </tr>
        <tr>
            <th>1</th>
            <th>A</th>
            <td><input type="number" value="3" class="sl"></td>
            <td><input type="number" value="200" class="dg"></td>
            <td class="tt"></td>
        </tr>
         <tr>
            <th>2</th>
            <th>B</th>
            <td><input type="number" value="2" class="sl"></td>
            <td><input type="number" value="2000" class="dg"></td>
            <td class="tt"></td>
        </tr>
         <tr>
            <th>3</th>
            <th>C</th>
            <td><input type="number" value="4" class="sl"></td>
            <td><input type="number" value="2300" class="dg"></td>
            <td class="tt"></td>
        </tr>
         <tr>
            <th>4</th>
            <th>D</th>
            <td><input type="number" value="2" class="sl"></td>
            <td><input type="number" value="200" class="dg"></td>
            <td class="tt"></td>
        </tr>
        <tr>
            <td colspan="4"><b>Tổng tiền </b></td>
            <td id ="tong"></td>
        </tr>


    </table>
    <script>
        var sl= document.getElementsByClassName("sl");
        var dg= document.getElementsByClassName("dg");
        var tt= document.getElementsByClassName("tt");
        var tong = 0;
        for(let i = 0 ; i < sl.length; i++){
            var soluong = parseInt(sl[i].value);
            var dongia = parseInt(dg[i].value);
            var thanhtien = soluong * dongia;
            tt[i].innerText = thanhtien;
            tong += thanhtien

        }
        document.getElementById("tong").innerHTML = tong;
    </script>
</body>
</html>
