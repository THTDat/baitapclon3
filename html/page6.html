<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>info</title>
</head>
<body>
    <div class="container"></div>
    <input type="button" value="thêm" onclick="add()">

    <script>
        function add(){
            const myRow = document.createElement("div");
            myRow.setAttribute("class", "row");

            const text = document.createTextNode("haha");
            myRow.appendChild(text);

            const container = document.querySelector(".container");
            container.appendChild(myRow);
        }
    </script>
</body>
</html>
